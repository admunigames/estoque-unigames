name: Restaurar versão do site

# Publica de novo uma versão anterior do site, sem mexer na branch main.
# Rode pela aba Actions > "Restaurar versão do site" > "Run workflow" e
# informe a etiqueta da versão (ex.: producao-2026-10-28-153012) ou o código
# de um commit. Passo a passo em docs/BACKUP-E-RESTAURACAO.md.
#
# Atenção: o próximo push na main publica a main de novo por cima desta
# restauração. Para deixar a volta definitiva, desfaça a mudança na main.

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Etiqueta (producao-AAAA-MM-DD-HHMMSS) ou commit a publicar"
        required: true
        type: string

# Mesmo grupo do deploy: nunca publica ao mesmo tempo que um push na main.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restore:
    name: Publicar versão ${{ inputs.versao }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da versão escolhida
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.versao }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Essa versão já passou por lint, tipos e testes quando foi publicada;
      # aqui só gera o build de novo para a restauração ser rápida.
      - name: Build
        run: pnpm build

      - name: Deploy with Wrangler
        run: pnpm exec wrangler deploy -c wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Resumo
        env:
          VERSAO: ${{ inputs.versao }}
        run: |
          {
            echo "Site restaurado para a versão \`$VERSAO\` (commit \`$(git rev-parse --short HEAD)\`)."
            echo
            echo "O próximo push na main publica a main de novo por cima desta versão."
          } >> "$GITHUB_STEP_SUMMARY"
